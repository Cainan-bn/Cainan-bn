<svg width="1200" height="390" viewBox="0 0 680 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .name { font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace; font-size: 28px; font-weight: 700; fill: #E6F1FB; letter-spacing: -0.5px; }
      .role { font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace; font-size: 13px; font-weight: 400; fill: #85B7EB; letter-spacing: 2px; }
      .tag { font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace; font-size: 11px; fill: #5DCAA5; }
      .tag-dim { font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace; font-size: 11px; fill: #AFA9EC; }
    </style>
  </defs>

  <!-- Dark background -->
  <rect width="680" height="220" rx="12" fill="#060D1A"/>

  <!-- Grid lines - horizontal -->
  <line x1="0" y1="40" x2="680" y2="40" stroke="#185FA5" stroke-width="0.5" opacity="0.3"/>
  <line x1="0" y1="80" x2="680" y2="80" stroke="#185FA5" stroke-width="0.5" opacity="0.15"/>
  <line x1="0" y1="120" x2="680" y2="120" stroke="#185FA5" stroke-width="0.5" opacity="0.15"/>
  <line x1="0" y1="160" x2="680" y2="160" stroke="#185FA5" stroke-width="0.5" opacity="0.15"/>
  <line x1="0" y1="200" x2="680" y2="200" stroke="#185FA5" stroke-width="0.5" opacity="0.3"/>

  <!-- Grid lines - vertical -->
  <line x1="60" y1="0" x2="60" y2="220" stroke="#185FA5" stroke-width="0.5" opacity="0.15"/>
  <line x1="120" y1="0" x2="120" y2="220" stroke="#185FA5" stroke-width="0.5" opacity="0.15"/>
  <line x1="180" y1="0" x2="180" y2="220" stroke="#185FA5" stroke-width="0.5" opacity="0.15"/>
  <line x1="240" y1="0" x2="240" y2="220" stroke="#185FA5" stroke-width="0.5" opacity="0.15"/>
  <line x1="300" y1="0" x2="300" y2="220" stroke="#185FA5" stroke-width="0.5" opacity="0.15"/>
  <line x1="360" y1="0" x2="360" y2="220" stroke="#185FA5" stroke-width="0.5" opacity="0.15"/>
  <line x1="420" y1="0" x2="420" y2="220" stroke="#185FA5" stroke-width="0.5" opacity="0.15"/>
  <line x1="480" y1="0" x2="480" y2="220" stroke="#185FA5" stroke-width="0.5" opacity="0.15"/>
  <line x1="540" y1="0" x2="540" y2="220" stroke="#185FA5" stroke-width="0.5" opacity="0.15"/>
  <line x1="600" y1="0" x2="600" y2="220" stroke="#185FA5" stroke-width="0.5" opacity="0.15"/>

  <!-- Glowing accent bar top -->
  <rect x="0" y="0" width="680" height="2" rx="1" fill="#185FA5" opacity="0.8"/>

  <!-- Left circuit -->
  <polyline points="30,50 30,90 50,90 50,130 30,130 30,170" fill="none" stroke="#185FA5" stroke-width="0.75" opacity="0.6"/>
  <circle cx="30" cy="50" r="3" fill="#7F77DD" opacity="0.8"/>
  <circle cx="50" cy="90" r="3" fill="#378ADD" opacity="0.8"/>
  <circle cx="50" cy="130" r="3" fill="#1D9E75" opacity="0.8"/>
  <circle cx="30" cy="170" r="3" fill="#7F77DD" opacity="0.8"/>

  <!-- Right circuit -->
  <polyline points="650,50 650,90 630,90 630,130 650,130 650,170" fill="none" stroke="#0F6E56" stroke-width="0.75" opacity="0.6"/>
  <circle cx="650" cy="50" r="3" fill="#1D9E75" opacity="0.8"/>
  <circle cx="630" cy="90" r="3" fill="#378ADD" opacity="0.8"/>
  <circle cx="630" cy="130" r="3" fill="#7F77DD" opacity="0.8"/>
  <circle cx="650" cy="170" r="3" fill="#1D9E75" opacity="0.8"/>

  <!-- Scattered nodes -->
  <circle cx="90" cy="55" r="2" fill="#378ADD" opacity="0.5"/>
  <circle cx="590" cy="165" r="2" fill="#1D9E75" opacity="0.5"/>
  <circle cx="110" cy="170" r="1.5" fill="#7F77DD" opacity="0.4"/>
  <circle cx="570" cy="55" r="1.5" fill="#378ADD" opacity="0.4"/>
  <circle cx="540" cy="100" r="2" fill="#7F77DD" opacity="0.35"/>
  <circle cx="140" cy="100" r="2" fill="#1D9E75" opacity="0.35"/>

  <!-- Connector lines -->
  <line x1="90" y1="55" x2="140" y2="100" stroke="#378ADD" stroke-width="0.4" opacity="0.3"/>
  <line x1="570" y1="55" x2="540" y2="100" stroke="#1D9E75" stroke-width="0.4" opacity="0.3"/>
  <line x1="540" y1="100" x2="590" y2="165" stroke="#7F77DD" stroke-width="0.4" opacity="0.3"/>
  <line x1="140" y1="100" x2="110" y2="170" stroke="#378ADD" stroke-width="0.4" opacity="0.3"/>

  <!-- Top comment label -->
  <text x="340" y="26" text-anchor="middle" class="tag" opacity="0.5">// software engineer · ai specialist · full stack</text>

  <!-- Main name -->
  <text x="340" y="105" text-anchor="middle" class="name">Cainã Barros</text>

  <!-- Role -->
  <text x="340" y="132" text-anchor="middle" class="role">FULL STACK · AI · LLMs · DATA</text>

  <!-- Accent lines -->
  <line x1="80" y1="110" x2="185" y2="110" stroke="#185FA5" stroke-width="0.75" opacity="0.7"/>
  <line x1="495" y1="110" x2="600" y2="110" stroke="#185FA5" stroke-width="0.75" opacity="0.7"/>

  <!-- Pills -->
  <rect x="157" y="152" width="68" height="18" rx="3" fill="#0C447C" opacity="0.6"/>
  <text x="191" y="164" text-anchor="middle" class="tag">LangGraph</text>

  <rect x="235" y="152" width="56" height="18" rx="3" fill="#085041" opacity="0.6"/>
  <text x="263" y="164" text-anchor="middle" class="tag">FastAPI</text>

  <rect x="301" y="152" width="50" height="18" rx="3" fill="#3C3489" opacity="0.6"/>
  <text x="326" y="164" text-anchor="middle" class="tag-dim">Angular</text>

  <rect x="361" y="152" width="44" height="18" rx="3" fill="#085041" opacity="0.6"/>
  <text x="383" y="164" text-anchor="middle" class="tag">Docker</text>

  <rect x="415" y="152" width="52" height="18" rx="3" fill="#0C447C" opacity="0.6"/>
  <text x="441" y="164" text-anchor="middle" class="tag">Python</text>

  <rect x="477" y="152" width="46" height="18" rx="3" fill="#3C3489" opacity="0.6"/>
  <text x="500" y="164" text-anchor="middle" class="tag-dim">RAG</text>

  <!-- GitHub handle -->
  <text x="340" y="195" text-anchor="middle" class="tag" opacity="0.35">github.com/Cainan-bn</text>

  <!-- Bottom accent -->
  <rect x="0" y="218" width="680" height="2" rx="1" fill="#0F6E56" opacity="0.8"/>
</svg>
